from kivy.app import App
from kivy.uix.boxlayout import BoxLayout
from kivy.uix.label import Label
from kivy.uix.button import Button
from kivy.core.window import Window


class MyApp(App):
    def build(self):
        Window.clearcolor = (0.08, 0.10, 0.16, 1)

        layout = BoxLayout(
            orientation="vertical",
            padding=25,
            spacing=15
        )

        title = Label(
            text="برنامه مدیریت روبیکا",
            font_size="25sp",
            size_hint=(1, 0.25)
        )

        description = Label(
            text="برای شروع، وضعیت برنامه را بررسی کنید.",
            font_size="16sp",
            size_hint=(1, 0.2)
        )

        self.status = Label(
            text="وضعیت: آماده",
            font_size="18sp",
            size_hint=(1, 0.2)
        )

        button = Button(
            text="بررسی برنامه",
            font_size="20sp",
            size_hint=(1, 0.2)
        )

        button.bind(on_press=self.check_app)

        layout.add_widget(title)
        layout.add_widget(description)
        layout.add_widget(self.status)
        layout.add_widget(button)

        return layout

    def check_app(self, instance):
        self.status.text = "برنامه با موفقیت اجرا شد."


if __name__ == "__main__":
    MyApp().run()
